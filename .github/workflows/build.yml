name: Build OC Ferry

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false          # 一个平台失败不影响另一个
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22        # 项目 engines 要求 >=22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output (debug)
        run: |
          echo "=== 当前目录 ==="
          pwd
          echo "=== 目录列表 ==="
          ls -la
          echo "=== release 目录内容 ==="
          ls -la release/ || echo "release 目录不存在"
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oc-ferry-${{ matrix.os }}
          path: release/          # 项目配置中输出目录是 release
          if-no-files-found: error # 如果找不到文件，直接报错，方便排查
